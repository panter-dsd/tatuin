name: Cargo Miri
permissions:
  contents: read
on:
  workflow_call:
  workflow_dispatch:
jobs:
  cargo-miri-test:
    name: Cargo miri
    runs-on: ubuntu-latest
    # cargo-miri's generated sysroot manifest declares an unused `sysroot`
    # dependency, which trips the new `cargo::unused_dependencies` lint. On
    # runners that configure `build.warnings = "deny"` this aborts the sysroot
    # build, so force `warn` for the miri steps.
    env:
      CARGO_BUILD_WARNINGS: warn
    steps:
      - name: Fetch Repository
        uses: actions/checkout@v7
      - name: Install stable toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v2
      - name: Setup miri
        run: |
          rustup toolchain install nightly --component miri;
          rustup override set nightly;
          cargo miri setup;
      - name: Test with Miri
        run: cargo miri test --workspace --all-targets --all-features
